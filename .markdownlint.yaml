# markdownlint configuration
# See: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md

default: true

# Allow long lines: Korean text and URLs make 80-col limit impractical.
MD013: false

# Allow inline HTML: required for centered logo (<picture>, <p align>),
# badges (<a><b>), and side-by-side feature tables.
MD033: false

# Do not require the first line to be a top-level heading: README opens
# with an HTML comment + centered logo.
MD041: false

# Disable list indentation enforcement: 2-space and 4-space nesting are
# both valid markdown.
MD007: false
